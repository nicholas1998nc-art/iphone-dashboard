
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101722">
<title>Desk Station</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;color:#eef4fb;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{padding:10px}
.screen{height:100%;display:grid;grid-template-columns:1.25fr 0.75fr;grid-template-rows:1.2fr 0.8fr;gap:10px}
.panel{background:#1a2635;border:1px solid #29394c;border-radius:14px;padding:14px;min-width:0;overflow:hidden}

/* Pannello Orologio (in alto a sinistra) */
.top{grid-column:1;grid-row:1;display:flex;flex-direction:column;justify-content:space-between}
.clock{font-size:clamp(64px, 15vw, 124px);font-weight:700;letter-spacing:-4px;line-height:0.95;margin:4px 0}
.date{font-size:clamp(16px, 3.2vw, 22px);color:#a9bbcf;margin-top:6px}

/* Pannello Agenda (in basso a sinistra) */
.bottomleft{grid-column:1;grid-row:2;display:flex;flex-direction:column}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.tile{background:#223247;border-radius:10px;padding:10px}
.tile strong{font-size:18px;display:block;margin-top:2px}
.tile span{font-size:10px;color:#9fb1c5;letter-spacing:0.5px}

/* Pannello Meteo verticale (tutta la colonna di destra) */
.weather{grid-column:2;grid-row:1 / 3;display:flex;flex-direction:column;justify-content:space-between}
.weather-main{display:flex;flex-direction:column;gap:4px}
.weather-header{display:flex;align-items:center;gap:12px;margin:4px 0}
.temp{font-size:clamp(48px, 10vw, 76px);font-weight:700;line-height:1}
.icon{font-size:clamp(44px, 8vw, 62px);line-height:1}
.condition{font-size:15px;color:#c5d2df}

/* Dettagli e previsioni verticali */
.weather-stats{display:flex;flex-direction:column;gap:6px;background:#223247;padding:10px 12px;border-radius:10px;font-size:13px;color:#c5d2df}
.weather-stats div{display:flex;justify-content:space-between}
.forecast{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.forecast-row{display:flex;align-items:center;justify-content:space-between;background:#223247;padding:7px 10px;border-radius:8px;font-size:13px;color:#d7e1eb}
.forecast-row .f-time{font-weight:600;color:#9eb0c4;width:42px}
.forecast-row .f-icon{font-size:18px}
.forecast-row .f-temp{font-weight:700;font-size:15px;color:#eef4fb}
.forecast-row .f-rain{font-size:11px;color:#83c7ff;width:36px;text-align:right}

/* Utility */
.muted{color:#9eb0c4}
.label{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#8fa5bc;font-weight:700;margin-bottom:6px}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#c5d2df}
.foot{font-size:10px;color:#7f94aa;margin-top:auto}
#status{font-size:11px;color:#8299b1}

@media(max-height:380px){
  body{padding:6px}
  .screen{gap:6px}
  .panel{padding:10px}
  .clock{font-size:68px}
  .temp{font-size:44px}
  .icon{font-size:38px}
  .forecast-row{padding:4px 8px;font-size:12px}
  .weather-stats{padding:6px 10px;gap:3px}
}
</style>
</head>
<body>
<div class="screen">
  <!-- Orologio -->
  <section class="panel top">
    <div>
      <div class="label">Ora locale</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">Caricamento data…</div>
    </div>
    <div class="stats">
      <span>🔋 <b id="battery">—</b></span>
      <span>📶 <b id="connection">Online</b></span>
      <span id="status">Avvio…</span>
    </div>
  </section>

  <!-- Agenda -->
  <section class="panel bottomleft">
    <div class="label">Agenda e calendario</div>
    <div class="rows">
      <div class="tile"><span>PROSSIMO APPUNTAMENTO</span><strong id="event">Nessun evento</strong></div>
      <div class="tile"><span>GIORNO DELL'ANNO</span><strong id="yearday">—</strong></div>
    </div>
    <div class="foot">Per gli appuntamenti usa il Calendario dell’iPhone.</div>
  </section>

  <!-- Meteo verticale -->
  <section class="panel weather">
    <div class="weather-main">
      <div class="label">Meteo adesso</div>
      <div class="weather-header">
        <div class="icon" id="weatherIcon">🌤️</div>
        <div class="temp"><span id="temp">--</span>°</div>
      </div>
      <div class="condition" id="condition">Attendo posizione…</div>
    </div>

    <div class="weather-stats">
      <div><span>💧 Umidità</span><b id="humidity">--%</b></div>
      <div><span>🌬️ Vento</span><b id="wind">-- km/h</b></div>
    </div>

    <div>
      <div class="label" style="margin-bottom:6px">Prossime ore</div>
      <div class="forecast" id="forecast">
        <div class="forecast-row"><span class="muted">Caricamento…</span></div>
      </div>
    </div>

    <div class="foot">Aggiornato: <span id="updated">—</span></div>
  </section>
</div>

<script>
(function(){
 function tick(){
  var d=new Date(), z=function(n){return n<10?'0'+n:n};
  document.getElementById('clock').textContent=z(d.getHours())+':'+z(d.getMinutes());
  var days=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  var months=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  document.getElementById('date').textContent=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
  var start=new Date(d.getFullYear(),0,0);
  document.getElementById('yearday').textContent=Math.floor((d-start)/86400000)+' / 365';
 }
 tick();setInterval(tick,1000);

 if(navigator.getBattery){navigator.getBattery().then(function(b){
  function bat(){document.getElementById('battery').textContent=Math.round(b.level*100)+'%'+(b.charging?' ⚡':'')}
  bat();b.addEventListener('levelchange',bat);b.addEventListener('chargingchange',bat);
 }).catch(function(){document.getElementById('battery').textContent='N/D'})}
 else document.getElementById('battery').textContent='N/D';

 if(navigator.onLine===false)document.getElementById('connection').textContent='Offline';
 window.addEventListener('offline',function(){document.getElementById('connection').textContent='Offline'});
 window.addEventListener('online',function(){document.getElementById('connection').textContent='Online'});

 function code(c){
  if(c===0)return ['☀️','Sereno'];
  if(c<3)return ['🌤️','Poco nuvoloso'];
  if(c===3)return ['☁️','Coperto'];
  if(c<50)return ['🌫️','Nebbia'];
  if(c<70)return ['🌦️','Pioviggine'];
  if(c<80)return ['🌧️','Pioggia'];
  if(c<90)return ['🌨️','Neve'];
  return ['⛈️','Temporale'];
 }

 function loadWeather(lat,lon){
  var url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=1&timezone=auto';
  var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=12000;
  x.onreadystatechange=function(){if(x.readyState===4){if(x.status>=200&&x.status<300){try{
   var j=JSON.parse(x.responseText),c=j.current,w=code(c.weather_code);
   document.getElementById('temp').textContent=Math.round(c.temperature_2m);
   document.getElementById('weatherIcon').textContent=w[0];
   document.getElementById('condition').textContent=w[1]+' • percepita '+Math.round(c.apparent_temperature)+'°';
   document.getElementById('humidity').textContent=c.relative_humidity_2m+'%';
   document.getElementById('wind').textContent=Math.round(c.wind_speed_10m)+' km/h';

   var h=j.hourly,now=new Date().getHours(),s='';
   for(var k=1;k<=4;k++){
    var idx=Math.min(now+k,h.time.length-1),ww=code(h.weather_code[idx])[0];
    s+='<div class="forecast-row">'
      +'<span class="f-time">'+h.time[idx].substr(11,5)+'</span>'
      +'<span class="f-icon">'+ww+'</span>'
      +'<span class="f-temp">'+Math.round(h.temperature_2m[idx])+'°</span>'
      +'<span class="f-rain">💧'+h.precipitation_probability[idx]+'%</span>'
      +'</div>';
   }
   document.getElementById('forecast').innerHTML=s;
   document.getElementById('updated').textContent=new Date().toLocaleTimeString().substr(0,5);
   document.getElementById('status').textContent='Meteo OK';
  }catch(e){document.getElementById('status').textContent='Errore dati meteo'}}else document.getElementById('status').textContent='Meteo non disp.'}}};
  x.ontimeout=function(){document.getElementById('status').textContent='Timeout meteo'};x.send();
 }

 function locate(){
  if(navigator.geolocation){
   navigator.geolocation.getCurrentPosition(function(p){loadWeather(p.coords.latitude,p.coords.longitude)},function(){document.getElementById('status').textContent='Attiva posizione'},{enableHighAccuracy:false,timeout:10000,maximumAge:1800000});
  }else document.getElementById('status').textContent='Posizione non supp.';
 }
 locate();setInterval(locate,1800000);
})();
</script>
</body>
</html>
